name: Refresh public data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 13 * * 1"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run refresh:fec
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      - run: npm test
      - name: Commit changed snapshot
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/power-data.json public/data/v3 public/downloads
          git commit -m "Refresh FEC power metrics"
          git push
